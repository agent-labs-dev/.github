name: Bug report
description: Something is broken, crashes or gives a wrong result.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you ran, for example the output of the tool's `--version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, and the runtime or app it ran in where that matters.
      placeholder: macOS 15, Node 24
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or input that shows the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error, log or trace. Remove keys, tokens and private data first.
      render: text
